name: CI

on:
  push:
    branches: [Main, main]
  pull_request:
    branches: [Main, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright
        run: cd tests/playwright && pnpm playwright install --with-deps chromium

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: cd tests/playwright && pnpm playwright test --grep "@b2c|@cart|@admin"